<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Project | Sign-up Form</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <aside role="background-img" aria-label="green leaf ferns plant">
            <header>
                <div class="logo">
                    <img id="odin-logo" src="./assets/odin-lined.png" alt="odin logo">
                    <h1 id="odin">ODIN</h1>
                </div>
            </header>
            <footer>
                <p>
                    Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
                    <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a>
                </p>
            </footer>
        </aside>        
        <main>
            <section class="top-paragraph">
                <p>
                    This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    Sign up <em>now</em> to get started.
                </p>
                <p>
                    You <em>know</em> you want to.
                </p>                
            </section>
            <section class="form">
                <form id="dummy-form">
                    <p>Let's do this!</p>
                    <div>
                        <div>
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" name="first_name" id="first_name" required>
                        </div>       
                        <div>
                            <label for="last_name">LAST NAME</label>
                            <input type="text" name="last_name" id="last_name" required>
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email" required>
                        </div>
                        <div>
                            <label for="phone_number">PHONE NUMBER</label>
                            <input type="tel" name="phone_number" id="phone_number" required>
                        </div>                        
                    </div>
                    <div>
                        <div>
                            <label for="pwd">PASSWORD</label>
                            <input 
                                type="password"
                                name="password"
                                id="pwd"
                                minlength="8"
                                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters"
                                placeholder=""
                                required>
                        </div>
                        <div>
                            <label for="confirm_pwd">CONFIRM PASSWORD</label>
                            <input
                                type="password"
                                name="confirm_pwd"
                                id="confirm_pwd"
                                minlength="8"
                                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters"
                                required>
                        </div>                        
                    </div>
                </form>
            </section>
            <section class="bottom">
                <button type="submit" form="dummy-form">Create Account</button>
                <div>
                    Already have an account? <a>Log in</a>
                </div>
            </section>
        </main>
    </body>
</html>
